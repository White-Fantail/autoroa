services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: carfolio
      POSTGRES_PASSWORD: carfolio
      POSTGRES_DB: carfolio
    ports: ["5432:5432"]
    volumes: [carfolio-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U carfolio]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./services/api
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://carfolio:carfolio@postgres:5432/carfolio
      AUTH_MODE: development
      DEV_AUTH_SECRET: local-only-secret
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_JWT_ISSUER: ${SUPABASE_JWT_ISSUER:-}
      SUPABASE_JWT_AUDIENCE: ${SUPABASE_JWT_AUDIENCE:-authenticated}
      OCR_PROVIDER: mock
      MAPS_PROVIDER: mock
      CORS_ORIGINS: http://localhost:3000,http://localhost:8081
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
      WATCHPACK_POLLING: "true"
    ports: ["3000:3000"]
    volumes:
      - .:/workspace
      - carfolio-node-modules:/workspace/node_modules
      - carfolio-web-node-modules:/workspace/apps/web/node_modules
      - carfolio-web-next:/workspace/apps/web/.next
    depends_on:
      api: {condition: service_healthy}
volumes:
  carfolio-postgres:
  carfolio-node-modules:
  carfolio-web-node-modules:
  carfolio-web-next:
