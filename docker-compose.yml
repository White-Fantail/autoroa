services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: autoroa
      POSTGRES_PASSWORD: autoroa
      POSTGRES_DB: autoroa
    ports: ["5432:5432"]
    volumes: [autoroa-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U autoroa]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./services/api
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://autoroa:autoroa@postgres:5432/autoroa
      AUTH_MODE: development
      DEV_AUTH_SECRET: local-only-secret
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_JWT_ISSUER: ${SUPABASE_JWT_ISSUER:-}
      SUPABASE_JWT_AUDIENCE: ${SUPABASE_JWT_AUDIENCE:-authenticated}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      OCR_PROVIDER: mock
      MAPS_PROVIDER: google
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:8081,http://127.0.0.1:8081
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
      WATCHPACK_POLLING: "true"
    ports: ["3000:3000"]
    volumes:
      - .:/workspace
      - autoroa-node-modules:/workspace/node_modules
      - autoroa-web-node-modules:/workspace/apps/web/node_modules
      - autoroa-web-next:/workspace/apps/web/.next
    depends_on:
      api: {condition: service_healthy}
volumes:
  autoroa-postgres:
  autoroa-node-modules:
  autoroa-web-node-modules:
  autoroa-web-next:
