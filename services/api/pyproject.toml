[project]
name = "carfolio-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.116,<1","uvicorn[standard]>=0.34,<1","sqlalchemy>=2.0.40,<3","alembic>=1.15,<2","pydantic-settings>=2.8,<3","pyjwt[crypto]>=2.10,<3","httpx>=0.28,<1","psycopg[binary]>=3.2,<4","python-multipart>=0.0.20,<1"]
[dependency-groups]
dev = ["pytest>=8.3,<9","pytest-asyncio>=0.26,<1","ruff>=0.11,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
