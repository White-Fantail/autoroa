name: Quick Capture validation
on: [push, pull_request]
jobs:
  api-quick-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --project services/api
      - run: uv run --project services/api ruff check services/api/app/quick_capture.py services/api/alembic/versions/0016_optional_fillup_odometer.py services/api/alembic/versions/0017_quick_captures.py services/api/tests/test_quick_capture.py
      - run: cd services/api && uv run pytest -q tests/test_quick_capture.py tests/test_quick_capture_review.py tests/test_migrations.py tests/test_services.py -k 'not untracked_legacy_baseline_is_reconciled_and_rate_limits_created'
      - run: cd services/api && uv run pytest -q tests/test_api.py -k 'quick_capture or receipt_only or canonical_fuel_label'
  mobile-quick-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 9.15.4}
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @autoroa/mobile typecheck
      - run: pnpm --filter @autoroa/mobile test

  ios-configuration:
    runs-on: ubuntu-latest
    env:
      EAS_BUILD: "true"
      EAS_BUILD_PLATFORM: ios
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 9.15.4}
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: cd apps/mobile && pnpm exec expo config --type public --json > /tmp/autoroa-ios.json
      - run: node -e 'const cfg=require("/tmp/autoroa-ios.json"); if(cfg.scheme!=="autoroa"||cfg.ios?.bundleIdentifier!=="nz.co.autoroa.app") process.exit(1);'
